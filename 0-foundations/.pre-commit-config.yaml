repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check .
        language: system
        pass_filenames: false

      - id: mypy
        name: mypy
        entry: mypy --config-file pyproject.toml src tests
        language: system
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: python -m pytest -q tests
        language: system
        pass_filenames: false
